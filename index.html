    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="curds">
        <div class="header">
            <h1>curds</h1>
            <p>product management system</p>
        </div>
        <div class="inputs">
            <form>
                <input type="text" name="" id="title" placeholder="title">
                <div class="inputs-number">
                    <input type="text" inputmode="decimal" name="price" id="price" placeholder="price" dir="ltr">
                    <input type="text" inputmode="decimal" name="taxes" id="taxes" placeholder="taxes">
                    <input type="text" inputmode="decimal" name="ads" id="ads" placeholder="ads">
                    <input type="text" inputmode="decimal" name="discount" id="discount" placeholder="discount">
                    <small id="total"></small>
                </div>
                <input type="number" name="count" id="count" placeholder="count">
                <input type="text" name="category" id="category" placeholder="category">
                <p id="error">Please enter the title, price and category</p>
                <button type="submit" class="Create" id="submit">Create</button>
            </form>
        </div>
        <div class="outputs">
            <form>
                <input type="text" name="" id="Search" placeholder="Search">
                <div class="button-Search">
                    <button type="button" id="Search-Title">Search By Title</button>
                    <button type="button" id="Search-Category">Search By Category</button> 
                </div>
            </form>
            <div id="delete-all"></div>
            <div class="table-container">
                <table>
                    <tr>
                        <th>id</th>
                        <th>title</th>
                        <th>price</th>
                        <th>taxes</th>
                        <th>ads</th>
                        <th>discount</th>
                        <th>total</th>
                        <th>category</th>
                        <th>update</th>
                        <th>delete</th>
                    </tr>
                    <tbody id="tbody"> 
                        
                    </tbody>
                </table>
            </div>


        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
